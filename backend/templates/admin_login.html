<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMI — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('admin_static', filename='admin.css') }}">
</head>
<body>
<div class="login-page">
  <section class="card login-card">
    <div class="logo-mark">
      <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" width="22" height="22">
        <path d="M3 14 L7 8 L10 11 L13 6 L17 10" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="17" cy="10" r="2" fill="#fff"/>
      </svg>
    </div>
    <p class="login-kicker">OMI &middot; admin</p>
    <h1>Observability Maturity Index</h1>
    <p class="sub login-tag">Sign in to manage assessment questions and generate submission reports.</p>

    {% if error %}<p class="login-error">{{ error }}</p>{% endif %}

    {% if oauth_enabled %}
      <a href="{{ url_for('admin_google_login') }}" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3 16 3 9 7.4 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 45c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 36.4 26.7 37.3 24 37.3c-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9 40.6 16 45 24 45z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.2 5.2C40.9 36 44 30.6 44 24c0-1.2-.1-2.4-.4-3.5z"/>
        </svg>
        Sign in with Google
      </a>
      <p class="sub login-footnote">Google Workspace sign-in — access is granted by role, not just by account.</p>
    {% else %}
      <form method="POST">
        <label>Admin key
          <input type="password" name="key" required autofocus placeholder="Enter the shared admin key">
        </label>
        <button type="submit" class="submit">Enter</button>
      </form>
    {% endif %}
  </section>
</div>
</body>
</html>
