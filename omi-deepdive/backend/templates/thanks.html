<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Submitted — {{ app_row.name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrap narrow">
  <section class="card center">
    <span class="badge">omi-deepdive</span>
    <h1>Thanks — response recorded for {{ app_row.name }}</h1>

  </section>
</div>
</body>
</html>
